# Tool settings for the API only. The API is not a package to install: Render runs it from the
# repository with PYTHONPATH=pipeline, so it imports the pipeline's `finn` as it is.
#
#   python -m pytest api              tests, from the repository root (FINN_TEST_DB_URL for the database)
#   cd api && ruff check . && mypy    lint and types

[tool.pytest.ini_options]
# The repository root (for `api`) and the pipeline (for `finn` and its test helpers, `tests`).
pythonpath = ["..", "../pipeline"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# The pipeline's rule set: pycodestyle, pyflakes, imports, bugbear, pyupgrade, bandit, blind excepts.
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["api", "finn", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # pytest asserts; obviously fake secrets in tests

[tool.mypy]
python_version = "3.12"
files = ["."]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../pipeline"
explicit_package_bases = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
