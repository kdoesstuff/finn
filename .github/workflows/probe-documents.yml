name: Probe documents

# Run by hand: `gh workflow run probe-documents.yml` (optionally `-f symbol=INFY`).
# Checks that filing PDFs, results XBRL and transcripts download from GitHub's servers.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: NSE symbol to test with
        default: TCS

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - run: python probe_documents.py
        env:
          PROBE_SYMBOL: ${{ inputs.symbol }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe-documents
          path: pipeline/scripts/probe_documents.json
