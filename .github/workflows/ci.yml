name: CI

# Every push and pull request: lint, type check, the full test suite (real NSE fixtures, and the
# database schema and access rules on a real Postgres), a dependency audit, and a secret scan of
# the whole history. Nothing is merged or deployed on red.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    # Pinned: the database tests install Ubuntu 24.04's Postgres 16 and pgvector packages, the
    # same ones the schema was developed against.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - name: Postgres 16 with pgvector, for the database tests
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgvector
          pg_lsclusters -h | awk '$1 == 16 && $2 == "main"' | grep -q . || sudo pg_createcluster 16 main
          sudo pg_ctlcluster 16 main start || true  # exits non-zero if already running; pg_isready decides
          PORT=$(pg_lsclusters -h | awk '$1 == 16 && $2 == "main" {print $3}')
          pg_isready -h localhost -p "$PORT" -t 30
          sudo -u postgres psql -p "$PORT" -q -c "alter user postgres password 'postgres'"
          echo "FINN_TEST_DB_URL=postgresql://postgres:postgres@localhost:${PORT}/postgres" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan every commit, not just the latest
      - name: Secret scan (gitleaks)
        # Run as the runner's own user so git does not refuse the mounted repository as "dubious ownership".
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --verbose --exit-code 1
