name: Capture test fixtures

# Run by hand: `gh workflow run capture-fixtures.yml`, then
# `gh run download <id> -n fixtures -D pipeline/tests/fixtures`.
# Saves real NSE samples (filings, results XBRL, bhavcopy, pledges, a transcript) for parser tests.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run, space separated (blank = all): announcements results bhavcopy pledges insider annual_reports transcript integrated extras"
        default: ""

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline/scripts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      # The input goes through an environment variable, never straight into the shell line.
      - run: python capture_fixtures.py $STEPS
        env:
          STEPS: ${{ inputs.steps }}
      - uses: actions/upload-artifact@v7
        with:
          name: fixtures
          path: pipeline/scripts/fixtures/
