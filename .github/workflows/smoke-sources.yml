name: Smoke test sources

# Run by hand: gh workflow run smoke-sources.yml
# Every fetcher against live NSE from GitHub's runners (the network NSE answers). Red if any fails.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols to test, space separated"
        default: "TCS ASIANPAINT HDFCBANK"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      # The input goes through an environment variable, never straight into the shell line.
      - run: python scripts/smoke_sources.py $SYMBOLS
        env:
          SYMBOLS: ${{ inputs.symbols }}
