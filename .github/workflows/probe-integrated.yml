name: Probe integrated filings

# Run by hand: `gh workflow run probe-integrated.yml`, then
# `gh run download <id> -n probe-integrated -D pipeline/scripts`.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: NSE symbol to test with
        default: TCS

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_integrated.py
        env:
          PROBE_SYMBOL: ${{ inputs.symbol }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe-integrated
          path: pipeline/scripts/probe_integrated.json
